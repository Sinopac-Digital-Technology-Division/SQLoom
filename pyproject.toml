[project]
name = "sqloom"
version = "0.1.0"
description = "SQLoom is a tool that make extracting data lineage from SQL statement easily."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "posutsai", email = "yuehlin@sinopac.com"},
]
dependencies = [
    "lxml-stubs>=0.5.1",
    "lxml>=5.3.0",
    "more-itertools>=10.6.0",
    "parse>=1.20.2",
    "pymssql>=2.3.4",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
